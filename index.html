<!DOCTYPE html><html lang="zh-TW"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>全台蔬果產期查詢系統</title>
<style>
body{font-family:Microsoft JhengHei,sans-serif;background:#f4f7f4;padding:15px;max-width:800px;margin:auto}
h1{text-align:center;color:#2e7d32}
button{padding:8px 12px;margin:3px;border:1px solid #2e7d32;background:#fff;border-radius:6px;cursor:pointer}
button.active{background:#2e7d32;color:#fff;font-weight:bold}
.grid { 
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
}
.card {
    background: #fff;
    padding: 15px;
    border-left: 6px solid #2e7d32;
    border-radius: 8px;
    display: grid;
    /* 這裡定義三欄比例：圖片佔 60px，作物名稱佔 1.5 份，資訊區佔 3 份 */
    grid-template-columns: 80px 2fr 4fr;
    align-items: center; /* 垂直置中 */
    gap: 15px;
    justify-content: space-between; /* 文字左、圖片右 */
    min-height: 100px;        /* 確保卡片有足夠高度 */
}

.card img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
}

/* 作物名稱 */
.card h3 {
    margin: 0;
    font-size: 20px;
    justify-self: center; /* 這是關鍵：讓 h3 在它所在的格子內水平置中 */
    text-align: center;   /* 確保文字本身也是置中 */
}

/* 資訊區 (面積與產值) */
.card-info {
    text-align: left;
    font-size: 16px;
    line-height: 1.5;
    white-space: nowrap; /* 強制文字不換行 */
}

/* 手機版細節調整 */
@media (max-width: 480px) {
    .card {
        grid-template-columns: 70px 2fr 4fr;
        padding: 12px;
    }
    .card-info { font-size: 14px; }
    .card h3 { font-size: 17px; }
}
.summary{background:#fff;padding:10px;border-radius:6px;margin:10px 0}
</style></head><body>
